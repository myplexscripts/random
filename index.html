<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Meloday Flow Mesh</title>
<style>
  :root {
    color-scheme: dark;
    background: rgb(45 35 80);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 18%, rgb(30 90 220 / 0.28), transparent 46%),
      radial-gradient(circle at 82% 78%, rgb(135 55 105 / 0.35), transparent 50%),
      rgb(45 35 80);
  }

  body {
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    width: min(100vw, 100vh);
    aspect-ratio: 1;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <svg id="art" viewBox="0 0 1000 1000" role="img" aria-label="Animated Meloday waveform mesh">
    <defs>
      <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="rgb(45,35,80)" />
        <stop offset="48%" stop-color="rgb(75,65,120)" />
        <stop offset="100%" stop-color="rgb(85,25,65)" />
      </linearGradient>

      <linearGradient id="flowGradient" gradientUnits="userSpaceOnUse" x1="-80" y1="350" x2="1080" y2="650">
        <stop id="s0" offset="0%"   stop-color="rgb(30,90,220)" />
        <stop id="s1" offset="16%"  stop-color="rgb(30,180,255)" />
        <stop id="s2" offset="33%"  stop-color="rgb(115,155,245)" />
        <stop id="s3" offset="50%"  stop-color="rgb(135,50,255)" />
        <stop id="s4" offset="67%"  stop-color="rgb(225,20,135)" />
        <stop id="s5" offset="84%"  stop-color="rgb(255,128,185)" />
        <stop id="s6" offset="100%" stop-color="rgb(215,190,245)" />
      </linearGradient>

      <filter id="softMaskBlur" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="18" />
      </filter>

      <filter id="innerSoftness" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="6" />
      </filter>

      <mask id="softM" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
        <rect width="1000" height="1000" fill="black" />
        <path id="maskPath"
          fill="none"
          stroke="white"
          stroke-width="278"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#softMaskBlur)" />
        <path id="maskCore"
          fill="none"
          stroke="white"
          stroke-opacity="0.78"
          stroke-width="238"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#innerSoftness)" />
      </mask>

      <radialGradient id="surfaceTint" cx="50%" cy="42%" r="74%">
        <stop offset="0%" stop-color="rgb(242,230,252)" stop-opacity="0.10" />
        <stop offset="58%" stop-color="rgb(185,135,230)" stop-opacity="0.03" />
        <stop offset="100%" stop-color="rgb(45,35,80)" stop-opacity="0.13" />
      </radialGradient>
    </defs>

    <rect width="1000" height="1000" fill="url(#bgGradient)" />

    <g mask="url(#softM)">
      <rect id="colourField" x="-180" y="0" width="1360" height="1000" fill="url(#flowGradient)" />
      <rect width="1000" height="1000" fill="url(#surfaceTint)" />
    </g>
  </svg>
</div>

<script>
(() => {
  const path = document.getElementById('maskPath');
  const core = document.getElementById('maskCore');
  const gradient = document.getElementById('flowGradient');
  const field = document.getElementById('colourField');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stops = [0,1,2,3,4,5,6].map(i => document.getElementById(`s${i}`));

  const palette = [
    [30, 90, 220],
    [30, 180, 255],
    [115, 155, 245],
    [135, 50, 255],
    [185, 135, 230],
    [215, 190, 245],
    [225, 20, 135],
    [255, 128, 185],
    [255, 185, 198]
  ];

  const sampleCount = 88;
  const xs = Array.from({ length: sampleCount }, (_, i) => -70 + (1140 * i) / (sampleCount - 1));

  function gaussian(x, center, width) {
    const z = (x - center) / width;
    return Math.exp(-0.5 * z * z);
  }

  function mProfile(nx, t) {
    // The major M structure itself slowly shifts and breathes.
    const leftCenter  = 0.285 + Math.sin(t * 0.42 + 0.4) * 0.020;
    const valleyCenter = 0.535 + Math.sin(t * 0.37 + 2.1) * 0.024;
    const rightCenter = 0.755 + Math.sin(t * 0.46 + 4.0) * 0.021;

    const leftWidth   = 0.118 + Math.sin(t * 0.31 + 0.8) * 0.013;
    const valleyWidth = 0.125 + Math.sin(t * 0.29 + 2.7) * 0.015;
    const rightWidth  = 0.112 + Math.sin(t * 0.35 + 4.8) * 0.013;

    const leftAmp   = 235 + Math.sin(t * 0.53 + 0.3) * 30;
    const valleyAmp = 250 + Math.sin(t * 0.47 + 2.2) * 34;
    const rightAmp  = 205 + Math.sin(t * 0.51 + 4.1) * 28;

    const baseline = 585 + Math.sin(t * 0.24) * 11;

    return baseline
      - leftAmp * gaussian(nx, leftCenter, leftWidth)
      + valleyAmp * gaussian(nx, valleyCenter, valleyWidth)
      - rightAmp * gaussian(nx, rightCenter, rightWidth);
  }

  function waveformY(nx, t) {
    // Horizontal phase travel makes the waveform visibly ebb and flow,
    // rather than just wiggling fixed control points.
    const xWarp =
      nx +
      0.027 * Math.sin((nx * 1.25 - t * 0.11) * Math.PI * 2) +
      0.012 * Math.sin((nx * 2.10 + t * 0.07 + 0.6) * Math.PI * 2);

    const base = mProfile(xWarp, t);

    const travelling =
      34 * Math.sin((nx * 1.10 - t * 0.115) * Math.PI * 2 + 0.5) +
      15 * Math.sin((nx * 2.05 + t * 0.072) * Math.PI * 2 + 1.8) +
       7 * Math.sin((nx * 3.15 - t * 0.047) * Math.PI * 2 + 4.2);

    const envelope =
      0.42 +
      0.58 * (
        gaussian(nx, 0.28, 0.24) +
        gaussian(nx, 0.55, 0.22) +
        gaussian(nx, 0.77, 0.22)
      ) / 2.1;

    return base + travelling * envelope;
  }

  function smoothPath(points) {
    if (points.length < 2) return '';

    let d = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)}`;

    for (let i = 1; i < points.length - 1; i++) {
      const current = points[i];
      const next = points[i + 1];
      const midX = (current[0] + next[0]) / 2;
      const midY = (current[1] + next[1]) / 2;

      d += ` Q ${current[0].toFixed(2)} ${current[1].toFixed(2)}, ${midX.toFixed(2)} ${midY.toFixed(2)}`;
    }

    const last = points[points.length - 1];
    d += ` T ${last[0].toFixed(2)} ${last[1].toFixed(2)}`;
    return d;
  }

  function mix(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  function rgb(c) {
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function frame(ms) {
    // Long cycle keeps the motion soft and unhurried.
    const cycle = reduceMotion ? 0 : (ms % 22000) / 22000;
    const t = cycle * Math.PI * 2;

    const points = xs.map(x => {
      const nx = (x + 70) / 1140;
      return [x, waveformY(nx, t)];
    });

    const d = smoothPath(points);
    path.setAttribute('d', d);
    core.setAttribute('d', d);

    // Thickness breathes gently with the same waveform rhythm.
    const width =
      276 +
      Math.sin(t * 0.72 + 0.3) * 13 +
      Math.sin(t * 1.35 + 2.0) * 5;

    path.setAttribute('stroke-width', width.toFixed(2));
    core.setAttribute('stroke-width', (width - 40).toFixed(2));

    // Colour movement is independent of shape movement.
    const drift = Math.sin(t * 0.52 + 0.9) * 135;
    const tilt = 300 + Math.sin(t * 0.38 + 0.6) * 60;
    gradient.setAttribute('x1', String(-120 + drift));
    gradient.setAttribute('x2', String(1120 + drift));
    gradient.setAttribute('y1', String(500 - tilt * 0.5));
    gradient.setAttribute('y2', String(500 + tilt * 0.5));

    const colorShift = cycle * palette.length;
    stops.forEach((stop, i) => {
      const pos = (i * 1.22 + colorShift) % palette.length;
      const a = Math.floor(pos);
      const b = (a + 1) % palette.length;
      const local = pos - a;
      stop.setAttribute('stop-color', rgb(mix(palette[a], palette[b], local)));
    });

    const fieldX = -180 + Math.sin(t * 0.34 + 1.2) * 24;
    const fieldY = Math.cos(t * 0.31) * 10;
    field.setAttribute('x', fieldX.toFixed(2));
    field.setAttribute('y', fieldY.toFixed(2));

    if (!reduceMotion) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
