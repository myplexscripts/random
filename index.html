<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Meloday Flow Mesh</title>
<style>
  :root {
    color-scheme: dark;
    background: rgb(45 35 80);
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 18% 18%, rgb(30 90 220 / 0.28), transparent 46%),
      radial-gradient(circle at 82% 78%, rgb(135 55 105 / 0.35), transparent 50%),
      rgb(45 35 80);
  }

  body {
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .stage {
    width: min(100vw, 100vh);
    aspect-ratio: 1;
    overflow: hidden;
  }

  svg {
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <svg id="art" viewBox="0 0 1000 1000" role="img" aria-label="Animated Meloday mesh gradient">
    <defs>
      <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="rgb(45,35,80)" />
        <stop offset="48%" stop-color="rgb(75,65,120)" />
        <stop offset="100%" stop-color="rgb(85,25,65)" />
      </linearGradient>

      <linearGradient id="flowGradient" gradientUnits="userSpaceOnUse" x1="-80" y1="350" x2="1080" y2="650">
        <stop id="s0" offset="0%"   stop-color="rgb(30,90,220)" />
        <stop id="s1" offset="16%"  stop-color="rgb(30,180,255)" />
        <stop id="s2" offset="33%"  stop-color="rgb(115,155,245)" />
        <stop id="s3" offset="50%"  stop-color="rgb(135,50,255)" />
        <stop id="s4" offset="67%"  stop-color="rgb(225,20,135)" />
        <stop id="s5" offset="84%"  stop-color="rgb(255,128,185)" />
        <stop id="s6" offset="100%" stop-color="rgb(215,190,245)" />
      </linearGradient>

      <filter id="softMaskBlur" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="22" />
      </filter>

      <filter id="innerSoftness" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation="7" />
      </filter>

      <mask id="softM" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
        <rect width="1000" height="1000" fill="black" />
        <path id="maskPath"
          fill="none"
          stroke="white"
          stroke-width="245"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#softMaskBlur)" />
        <path id="maskCore"
          fill="none"
          stroke="white"
          stroke-opacity="0.72"
          stroke-width="205"
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#innerSoftness)" />
      </mask>

      <radialGradient id="surfaceTint" cx="50%" cy="42%" r="74%">
        <stop offset="0%" stop-color="rgb(242,230,252)" stop-opacity="0.16" />
        <stop offset="58%" stop-color="rgb(185,135,230)" stop-opacity="0.04" />
        <stop offset="100%" stop-color="rgb(45,35,80)" stop-opacity="0.16" />
      </radialGradient>
    </defs>

    <rect width="1000" height="1000" fill="url(#bgGradient)" />

    <g mask="url(#softM)">
      <rect id="colourField" x="-180" y="0" width="1360" height="1000" fill="url(#flowGradient)" />
      <rect width="1000" height="1000" fill="url(#surfaceTint)" />
    </g>
  </svg>
</div>

<script>
(() => {
  const path = document.getElementById('maskPath');
  const core = document.getElementById('maskCore');
  const gradient = document.getElementById('flowGradient');
  const field = document.getElementById('colourField');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const stops = [0,1,2,3,4,5,6].map(i => document.getElementById(`s${i}`));

  const palette = [
    [30, 90, 220],
    [30, 180, 255],
    [115, 155, 245],
    [135, 50, 255],
    [185, 135, 230],
    [215, 190, 245],
    [225, 20, 135],
    [255, 128, 185],
    [255, 185, 198]
  ];

  const base = [
    [ -55, 595 ],
    [  95, 575 ],
    [ 235, 355 ],
    [ 345, 300 ],
    [ 460, 405 ],
    [ 555, 685 ],
    [ 665, 530 ],
    [ 760, 385 ],
    [ 870, 500 ],
    [1055, 585 ]
  ];

  const phaseY = [0.2, 1.0, 1.8, 2.7, 3.4, 4.2, 4.9, 5.5, 0.8, 2.1];
  const phaseX = [1.5, 0.5, 2.4, 3.2, 4.0, 5.1, 5.8, 1.1, 2.9, 4.4];
  const ampY   = [8, 13, 18, 13, 14, 19, 13, 17, 12, 8];
  const ampX   = [4,  8,  7,  9,  7,  8,  8,  7,  7, 4];

  function catmullRomToBezier(points) {
    let d = `M ${points[0][0].toFixed(2)} ${points[0][1].toFixed(2)}`;

    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[Math.max(0, i - 1)];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[Math.min(points.length - 1, i + 2)];

      const tension = 0.72;
      const c1x = p1[0] + ((p2[0] - p0[0]) / 6) * tension;
      const c1y = p1[1] + ((p2[1] - p0[1]) / 6) * tension;
      const c2x = p2[0] - ((p3[0] - p1[0]) / 6) * tension;
      const c2y = p2[1] - ((p3[1] - p1[1]) / 6) * tension;

      d += ` C ${c1x.toFixed(2)} ${c1y.toFixed(2)}, ${c2x.toFixed(2)} ${c2y.toFixed(2)}, ${p2[0].toFixed(2)} ${p2[1].toFixed(2)}`;
    }
    return d;
  }

  function mix(a, b, t) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t)
    ];
  }

  function rgb(c) {
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function frame(ms) {
    const cycle = reduceMotion ? 0 : (ms % 16000) / 16000;
    const t = cycle * Math.PI * 2;

    const points = base.map(([x, y], i) => {
      if (i === 0 || i === base.length - 1) return [x, y];

      const slow = Math.sin(t + phaseY[i]);
      const second = Math.sin(t * 2 + phaseY[i] * 0.73) * 0.35;
      const driftX = Math.sin(t * 0.72 + phaseX[i]);

      return [
        x + driftX * ampX[i],
        y + (slow + second) * ampY[i]
      ];
    });

    const d = catmullRomToBezier(points);
    path.setAttribute('d', d);
    core.setAttribute('d', d);

    const width = 244 + Math.sin(t * 0.82) * 12 + Math.sin(t * 1.7 + 0.8) * 4;
    path.setAttribute('stroke-width', width.toFixed(2));
    core.setAttribute('stroke-width', (width - 38).toFixed(2));

    const drift = Math.sin(t * 0.78) * 120;
    const tilt = 330 + Math.sin(t * 0.55 + 0.6) * 90;
    gradient.setAttribute('x1', String(-120 + drift));
    gradient.setAttribute('x2', String(1120 + drift));
    gradient.setAttribute('y1', String(500 - tilt * 0.5));
    gradient.setAttribute('y2', String(500 + tilt * 0.5));

    const colorShift = cycle * palette.length;
    stops.forEach((stop, i) => {
      const pos = (i * 1.22 + colorShift) % palette.length;
      const a = Math.floor(pos);
      const b = (a + 1) % palette.length;
      const local = pos - a;
      stop.setAttribute('stop-color', rgb(mix(palette[a], palette[b], local)));
    });

    const fieldX = -180 + Math.sin(t * 0.43 + 1.2) * 28;
    const fieldY = Math.cos(t * 0.37) * 12;
    field.setAttribute('x', fieldX.toFixed(2));
    field.setAttribute('y', fieldY.toFixed(2));

    if (!reduceMotion) requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
