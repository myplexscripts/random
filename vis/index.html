<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meloday Visualizer Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#11151d;--text:#f7f8fb;--muted:#9da7b7;--line:rgba(255,255,255,.09);--a:#7c5cff;--b:#ff5ca8;--c:#4ca7ff;--d:#ff9466;--sidebar:220px}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;min-width:980px;background:radial-gradient(circle at 80% 10%,rgba(124,92,255,.12),transparent 28%),radial-gradient(circle at 10% 90%,rgba(255,92,168,.08),transparent 26%),var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow:hidden}button,input{font:inherit}button{color:inherit}.app{height:100vh;display:grid;grid-template-columns:var(--sidebar) 1fr}.sidebar{border-right:1px solid var(--line);padding:24px 16px;background:rgba(8,10,15,.84);backdrop-filter:blur(24px);display:flex;flex-direction:column;gap:24px}.brand{font-size:18px;font-weight:700;letter-spacing:.28em;padding:0 10px}.nav{display:grid;gap:8px}.nav button{width:100%;min-height:46px;border:0;background:transparent;border-radius:12px;padding:0 12px;text-align:left;display:flex;align-items:center;gap:12px;cursor:pointer;color:var(--muted);transition:.18s ease}.nav button.active,.nav button:hover{color:var(--text);background:rgba(255,255,255,.07)}.dot{width:9px;height:9px;border-radius:50%;background:currentColor;box-shadow:0 0 14px currentColor}.sidebar-footer{margin-top:auto;border-top:1px solid var(--line);padding-top:16px;color:var(--muted);font-size:13px;line-height:1.55}.main{position:relative;min-width:0;display:grid;grid-template-rows:74px 1fr 110px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:rgba(9,11,16,.58);backdrop-filter:blur(20px);z-index:5}.mode-copy h1{margin:0;font-size:18px;font-weight:650}.mode-copy p{margin:4px 0 0;color:var(--muted);font-size:13px}.actions{display:flex;align-items:center;gap:10px}.file-label,.ghost{min-height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;cursor:pointer}.file-label:hover,.ghost:hover{background:rgba(255,255,255,.08)}#fileInput{display:none}.stage{position:relative;overflow:hidden;background:radial-gradient(circle at center,rgba(255,255,255,.015),transparent 62%)}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.empty-state{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:3;transition:opacity .2s ease}.empty-card{max-width:520px;padding:28px;border:1px solid var(--line);border-radius:22px;background:rgba(15,18,25,.72);backdrop-filter:blur(20px);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.35)}.empty-card strong{display:block;font-size:20px;margin-bottom:8px}.empty-card span{color:var(--muted);line-height:1.55}.player{border-top:1px solid var(--line);background:rgba(9,11,16,.84);backdrop-filter:blur(24px);display:grid;grid-template-columns:minmax(240px,.7fr) minmax(420px,1.2fr) minmax(180px,.5fr);align-items:center;padding:14px 24px;gap:24px;z-index:6}.track{display:flex;align-items:center;gap:14px;min-width:0}.art{width:62px;height:62px;border-radius:12px;background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.55),transparent 11%),linear-gradient(145deg,var(--d),var(--b) 44%,var(--a));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 14px 28px rgba(0,0,0,.3);flex:none}.track-meta{min-width:0}.track-title{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track-artist{color:var(--muted);font-size:13px;margin-top:3px}.transport{display:grid;gap:10px}.transport-buttons{display:flex;align-items:center;justify-content:center;gap:22px}.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:18px;display:grid;place-items:center}.icon-btn:hover{background:rgba(255,255,255,.06)}.play{width:52px;height:52px;border:1px solid rgba(255,255,255,.42);background:rgba(255,255,255,.06);font-size:20px}.timeline{display:grid;grid-template-columns:42px 1fr 42px;align-items:center;gap:10px}.time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}.time:last-child{text-align:right}input[type=range]{width:100%;accent-color:#fff}.volume{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--muted)}#volume{max-width:140px}@media(max-width:1100px){:root{--sidebar:190px}.player{grid-template-columns:220px 1fr}.volume{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">MELODAY</div>
<div class="nav" id="modeNav">
<button class="active" data-mode="pulse"><span class="dot"></span>Pulse</button>
<button data-mode="ribbon"><span class="dot"></span>Ribbon</button>
<button data-mode="halo"><span class="dot"></span>Halo</button>
<button data-mode="drift"><span class="dot"></span>Drift</button>
<button data-mode="aura"><span class="dot"></span>Aura</button>
</div>
<div class="sidebar-footer">Lightweight Canvas 2D visualizers.<br>Load a local audio file or use demo motion.</div>
</aside>
<main class="main">
<header class="topbar">
<div class="mode-copy"><h1 id="modeTitle">Pulse</h1><p id="modeDescription">20 smoothed frequency bars</p></div>
<div class="actions"><button class="ghost" id="demoButton" type="button">Demo motion</button><label class="file-label" for="fileInput">Choose audio</label><input id="fileInput" type="file" accept="audio/*"></div>
</header>
<section class="stage" id="stage">
<canvas id="visualizer"></canvas>
<div class="empty-state" id="emptyState"><div class="empty-card"><strong>Choose an audio file</strong><span>The visualizer runs entirely in your browser. Use Demo motion to preview every mode without loading a song.</span></div></div>
</section>
<footer class="player">
<div class="track"><div class="art"></div><div class="track-meta"><div class="track-title" id="trackTitle">No track loaded</div><div class="track-artist">Local audio</div></div></div>
<div class="transport"><div class="transport-buttons"><button class="icon-btn" id="back10" aria-label="Back 10 seconds">↶</button><button class="icon-btn play" id="playPause" aria-label="Play">▶</button><button class="icon-btn" id="forward10" aria-label="Forward 10 seconds">↷</button></div><div class="timeline"><span class="time" id="currentTime">0:00</span><input id="seek" type="range" min="0" max="100" value="0" step="0.1"><span class="time" id="duration">0:00</span></div></div>
<div class="volume"><span>Volume</span><input id="volume" type="range" min="0" max="1" value="0.8" step="0.01"></div>
</footer>
</main>
</div>
<audio id="audio" crossorigin="anonymous"></audio>
<script>
const stage=document.getElementById('stage'),canvas=document.getElementById('visualizer'),ctx=canvas.getContext('2d'),audio=document.getElementById('audio'),fileInput=document.getElementById('fileInput'),playPause=document.getElementById('playPause'),demoButton=document.getElementById('demoButton'),emptyState=document.getElementById('emptyState'),trackTitle=document.getElementById('trackTitle'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),currentTimeEl=document.getElementById('currentTime'),durationEl=document.getElementById('duration'),title=document.getElementById('modeTitle'),description=document.getElementById('modeDescription'),navButtons=[...document.querySelectorAll('[data-mode]')];
const modes={pulse:['Pulse','20 smoothed frequency bars'],ribbon:['Ribbon','Single low-cost waveform ribbon'],halo:['Halo','48-point radial spectrum'],drift:['Drift','48 lightweight particles'],aura:['Aura','Four large reactive colour fields']};
const palette=['#7c5cff','#ff5ca8','#4ca7ff','#ff9466'];
let mode='pulse',demo=false,audioContext,analyser,source,freqData,timeData,particles=[],smoothBands=new Float32Array(64),lastFrame=performance.now(),dpr=Math.min(devicePixelRatio||1,2),loadedUrl='';
function resize(){const r=stage.getBoundingClientRect();canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function initAudio(){if(audioContext)return;audioContext=new (window.AudioContext||window.webkitAudioContext)();analyser=audioContext.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.82;source=audioContext.createMediaElementSource(audio);source.connect(analyser);analyser.connect(audioContext.destination);freqData=new Uint8Array(analyser.frequencyBinCount);timeData=new Uint8Array(analyser.fftSize)}
function demoValue(i,t,count){const a=Math.sin(t*.0011+i*.72)*.5+.5,b=Math.sin(t*.00073+i*.31+1.4)*.5+.5,c=Math.sin(t*.0017+i*.17+2.2)*.5+.5;return Math.min(1,.12+a*.43+b*.28+c*.17+Math.sin(t*.003+i)*.04)}
function getBands(count,t){const out=[];if(analyser&&!audio.paused&&!demo){analyser.getByteFrequencyData(freqData);for(let i=0;i<count;i++){const start=Math.floor((i/count)*(freqData.length*.78)),end=Math.max(start+1,Math.floor(((i+1)/count)*(freqData.length*.78)));let sum=0;for(let j=start;j<end;j++)sum+=freqData[j];out.push(sum/(end-start)/255)}}else{for(let i=0;i<count;i++)out.push(demo?demoValue(i,t,count):.04)}for(let i=0;i<count;i++){smoothBands[i]+=(out[i]-smoothBands[i])*.18;out[i]=smoothBands[i]}return out}
function getWave(count,t){const out=[];if(analyser&&!audio.paused&&!demo){analyser.getByteTimeDomainData(timeData);for(let i=0;i<count;i++){const idx=Math.floor(i/(count-1)*(timeData.length-1));out.push((timeData[idx]-128)/128)}}else{for(let i=0;i<count;i++){const x=i/(count-1);out.push(demo?(Math.sin(x*13+t*.0021)*.52+Math.sin(x*31-t*.0013)*.17+Math.sin(x*5+t*.0006)*.12):0)}}return out}
function clear(w,h){ctx.clearRect(0,0,w,h);const g=ctx.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.7);g.addColorStop(0,'#111622');g.addColorStop(1,'#090c12');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function lg(x0,y0,x1,y1){const g=ctx.createLinearGradient(x0,y0,x1,y1);g.addColorStop(0,palette[2]);g.addColorStop(.34,palette[0]);g.addColorStop(.66,palette[1]);g.addColorStop(1,palette[3]);return g}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawPulse(w,h,t){const bands=getBands(20,t),maxW=Math.min(w*.72,900),gap=10,bw=(maxW-gap*(bands.length-1))/bands.length,base=h*.67,maxH=h*.44,start=(w-maxW)/2;ctx.fillStyle=lg(start,0,start+maxW,0);bands.forEach((v,i)=>{const bh=24+v*maxH,x=start+i*(bw+gap),y=base-bh;rr(x,y,bw,bh,Math.min(14,bw/2));ctx.fill()})}
function smoothPath(points,pad,usable,cy,amp){ctx.beginPath();for(let i=0;i<points.length;i++){const x=pad+i/(points.length-1)*usable,y=cy+points[i]*amp;if(i===0)ctx.moveTo(x,y);else{const px=pad+(i-1)/(points.length-1)*usable,py=cy+points[i-1]*amp,mx=(px+x)/2,my=(py+y)/2;ctx.quadraticCurveTo(px,py,mx,my)}}}
function drawRibbon(w,h,t){const pts=getWave(96,t),amp=h*.2,cy=h*.5,pad=w*.08,usable=w-pad*2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=lg(pad,0,w-pad,0);for(const [width,alpha] of [[24,.12],[10,.45],[3,1]]){ctx.lineWidth=width;ctx.globalAlpha=alpha;smoothPath(pts,pad,usable,cy,amp);ctx.stroke()}ctx.globalAlpha=1}
function drawHalo(w,h,t){const bands=getBands(48,t),cx=w/2,cy=h/2,base=Math.min(w,h)*.22,push=Math.min(w,h)*.075;ctx.beginPath();bands.forEach((v,i)=>{const a=-Math.PI/2+i/bands.length*Math.PI*2,r=base+v*push,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.strokeStyle=lg(cx-base,cy,cx+base,cy);ctx.lineWidth=7;ctx.lineJoin='round';ctx.stroke();const s=base*1.08,g=ctx.createLinearGradient(cx-s/2,cy-s/2,cx+s/2,cy+s/2);g.addColorStop(0,palette[3]);g.addColorStop(.52,palette[1]);g.addColorStop(1,palette[0]);ctx.fillStyle=g;rr(cx-s/2,cy-s/2,s,s,22);ctx.fill()}
function ensureParticles(w,h){if(particles.length===48)return;particles=Array.from({length:48},(_,i)=>({x:Math.random()*w,y:Math.random()*h,r:3+Math.random()*12,vx:-.16+Math.random()*.32,vy:-.14+Math.random()*.28,band:i%32,alpha:.2+Math.random()*.6}))}
function drawDrift(w,h,t,dt){ensureParticles(w,h);const bands=getBands(32,t),e=bands.reduce((a,b)=>a+b,0)/bands.length;particles.forEach((p,i)=>{const v=bands[p.band]??e;p.x+=p.vx*dt*(1+v*2.2);p.y+=p.vy*dt*(1+v*2.2);if(p.x<-40)p.x=w+40;if(p.x>w+40)p.x=-40;if(p.y<-40)p.y=h+40;if(p.y>h+40)p.y=-40;ctx.globalAlpha=p.alpha*(.55+v*.45);ctx.fillStyle=palette[i%palette.length];ctx.beginPath();ctx.arc(p.x,p.y,p.r*(1+v*.85),0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1}
function drawAura(w,h,t){const b=getBands(16,t),vals=[avg(b.slice(0,4)),avg(b.slice(4,8)),avg(b.slice(8,12)),avg(b.slice(12,16))],pos=[[.2+.04*Math.sin(t*.0003),.24+.05*Math.cos(t*.00023)],[.74+.05*Math.cos(t*.00027),.24+.04*Math.sin(t*.00031)],[.26+.05*Math.cos(t*.00022),.72+.05*Math.sin(t*.00028)],[.72+.04*Math.sin(t*.00025),.7+.05*Math.cos(t*.00019)]];ctx.fillStyle='#090c12';ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='screen';for(let i=0;i<4;i++){const r=Math.max(w,h)*(.34+vals[i]*.08),x=w*pos[i][0],y=h*pos[i][1],g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,hexToRgba(palette[i],.78));g.addColorStop(.42,hexToRgba(palette[i],.32));g.addColorStop(1,hexToRgba(palette[i],0));ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}ctx.globalCompositeOperation='source-over'}
function hexToRgba(hex,a){const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return`rgba(${r},${g},${b},${a})`}function avg(a){return a.reduce((x,y)=>x+y,0)/Math.max(a.length,1)}
function frame(now){const r=stage.getBoundingClientRect(),w=r.width,h=r.height,dt=Math.min(40,now-lastFrame);lastFrame=now;clear(w,h);if(mode==='pulse')drawPulse(w,h,now);if(mode==='ribbon')drawRibbon(w,h,now);if(mode==='halo')drawHalo(w,h,now);if(mode==='drift')drawDrift(w,h,now,dt);if(mode==='aura')drawAura(w,h,now);requestAnimationFrame(frame)}requestAnimationFrame(frame);
navButtons.forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;navButtons.forEach(b=>b.classList.toggle('active',b===btn));title.textContent=modes[mode][0];description.textContent=modes[mode][1]}));
fileInput.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;initAudio();if(audioContext.state==='suspended')await audioContext.resume();if(loadedUrl)URL.revokeObjectURL(loadedUrl);loadedUrl=URL.createObjectURL(file);audio.src=loadedUrl;trackTitle.textContent=file.name.replace(/\.[^/.]+$/,'');emptyState.style.opacity='0';demo=false;demoButton.textContent='Demo motion';await audio.play();playPause.textContent='❚❚'});
playPause.addEventListener('click',async()=>{if(!audio.src){demo=!demo;emptyState.style.opacity=demo?'0':'1';playPause.textContent=demo?'❚❚':'▶';demoButton.textContent=demo?'Stop demo':'Demo motion';return}initAudio();if(audioContext.state==='suspended')await audioContext.resume();if(audio.paused){await audio.play();playPause.textContent='❚❚'}else{audio.pause();playPause.textContent='▶'}});
demoButton.addEventListener('click',()=>{demo=!demo;if(demo){if(!audio.paused)audio.pause();emptyState.style.opacity='0';playPause.textContent='❚❚';demoButton.textContent='Stop demo'}else{playPause.textContent='▶';demoButton.textContent='Demo motion';if(!audio.src)emptyState.style.opacity='1'}});
document.getElementById('back10').addEventListener('click',()=>{if(audio.duration)audio.currentTime=Math.max(0,audio.currentTime-10)});document.getElementById('forward10').addEventListener('click',()=>{if(audio.duration)audio.currentTime=Math.min(audio.duration,audio.currentTime+10)});audio.addEventListener('timeupdate',()=>{if(!audio.duration)return;seek.value=audio.currentTime/audio.duration*100;currentTimeEl.textContent=formatTime(audio.currentTime)});audio.addEventListener('loadedmetadata',()=>durationEl.textContent=formatTime(audio.duration));audio.addEventListener('ended',()=>playPause.textContent='▶');seek.addEventListener('input',()=>{if(audio.duration)audio.currentTime=Number(seek.value)/100*audio.duration});volume.addEventListener('input',()=>audio.volume=Number(volume.value));audio.volume=Number(volume.value);function formatTime(s){if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60).toString().padStart(2,'0');return`${m}:${sec}`}
</script>
</body>
</html>
